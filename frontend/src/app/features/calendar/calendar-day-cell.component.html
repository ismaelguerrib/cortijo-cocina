<mat-card
  class="day-card"
  [class.day-card--filled]="!!day().meal"
  (click)="openDayDetail()"
  data-testid="day-cell"
>
  <div class="day-card__header">
    <span class="day-card__number">{{ day().dayNumber }}</span>
  </div>

  @if (day().meal; as meal) {
    <div class="day-card__content">
      <p class="day-card__meta">
        {{ meal.dishes.length }} plat{{ meal.dishes.length > 1 ? 's' : '' }}
      </p>
      @if (cookers().length > 0) {
        <ul class="day-card__cookers">
          @for (cooker of cookers(); track cooker) {
            <li class="day-card__cooker">{{ cooker }}</li>
          }
        </ul>
      }
    </div>
  }
</mat-card>
