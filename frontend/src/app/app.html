<div class="app-background" aria-hidden="true">
  @for (item of backgroundItems; track item.src) {
    <img
      class="app-background__family"
      [src]="item.src"
      alt=""
      [style.top]="item.top"
      [style.left]="item.left"
      [style.width]="item.size"
      [style.opacity]="item.opacity"
      [style.animation-duration]="item.duration"
      [style.animation-delay]="item.delay"
      [style.--family-drift-x]="item.driftX"
      [style.--family-drift-y]="item.driftY"
      [style.--family-rotation]="item.rotation"
    />
  }
</div>

<div class="app-shell">
  <header class="app-shell__header">
    <div class="app-shell__brand-block">
      <a routerLink="/calendrier" class="app-shell__brand">Cortijo Cocina</a>
      <p class="app-shell__tagline">Los Hamdanos vacaciones</p>
    </div>

    <nav class="app-shell__nav" aria-label="Navigation principale">
      <a
        routerLink="/calendrier"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Calendrier
      </a>
      <a routerLink="/recettes" routerLinkActive="is-active">Recettes</a>
    </nav>
  </header>

  <router-outlet />
</div>
